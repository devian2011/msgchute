version: "3.7"
services:
  db:
    image: postgres:14.1-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - '15432:5432'
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - notifier


volumes:
  db:
    driver: local

networks:
  notifier:
    name: notifier
    external: false